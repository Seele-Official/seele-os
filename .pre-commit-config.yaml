# .pre-commit-config.yaml
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
            # pnpm v12 writes pnpm-lock.yaml as two YAML documents: a leading env
            # lockfile document followed by the project lockfile.
            args: [--allow-multiple-documents]
          - id: check-added-large-files
          - id: check-merge-conflict

    - repo: local
      hooks:
          - id: clang-format
            name: clang-format
            entry: clang-format -i
            language: system
            types_or: [c++, c]

          - id: prettier
            name: Prettier
            entry: pnpm exec prettier --write
            language: system
            files: '\.(ts|md|json|ya?ml)$'
            types: [file]
            require_serial: true
